name: Native macOS ARM64
on:
  workflow_dispatch:
  push:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'packaging/**', 'scripts/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'packaging/**', 'scripts/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - name: Unit tests
        run: swift test --arch arm64
      - name: Check four-track stereo preparation
        run: |
          xcrun swiftc -parse-as-library Sources/CappellaMac/StereoAudioPreparation.swift scripts/check_audio_preparation.swift -o .build/check-audio
          .build/check-audio
      - name: Check timeline text input
        run: |
          xcrun swiftc -parse-as-library Sources/CappellaMac/DialogueTextEditor.swift scripts/check_timeline_text.swift -o .build/check-text-input
          .build/check-text-input
      - name: Build and package native app
        run: bash scripts/build-macos.sh
      - name: Launch empty editor on macOS 15
        run: python3 scripts/smoke_macos.py "dist/Cappella.app" --screenshot dist/previews/empty.png
      - name: Open DetX with intermediate signs on macOS 15
        run: python3 scripts/smoke_macos.py "dist/Cappella.app" --fixture Tests/Fixtures/layout.detx --screenshot dist/previews/detx.png
      - name: Open files from Finder on macOS 15
        run: |
          xcrun swiftc -parse-as-library scripts/check_finder_open.swift -o /tmp/cappella-check-finder
          /tmp/cappella-check-finder "dist/Cappella.app" Tests/Fixtures/layout.detx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CappellaMac-previews-macos-15
          path: dist/previews/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Cappella-MacOS-arm64
          path: dist/Cappella-MacOS-arm64.zip
          if-no-files-found: error
  launch-macos-26:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Cappella-MacOS-arm64
          path: dist
      - name: Extract app built on macOS 15
        run: ditto -x -k dist/Cappella-MacOS-arm64.zip dist
      - name: Launch empty editor on macOS 26
        run: python3 scripts/smoke_macos.py "dist/Cappella.app" --screenshot dist/previews/empty.png
      - name: Open DetX with intermediate signs on macOS 26
        run: python3 scripts/smoke_macos.py "dist/Cappella.app" --fixture Tests/Fixtures/layout.detx --screenshot dist/previews/detx.png
      - name: Open files from Finder on macOS 26
        run: |
          xcrun swiftc -parse-as-library scripts/check_finder_open.swift -o /tmp/cappella-check-finder
          /tmp/cappella-check-finder "dist/Cappella.app" Tests/Fixtures/layout.detx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CappellaMac-previews-macos-26
          path: dist/previews/*.png
          if-no-files-found: ignore
